<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Booking System</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
      padding: 30px;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 90%;
      padding: 10px;
      margin: 10px;
    }
    button {
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Booking Servis</h2>

  <input type="text" id="name" placeholder="Nama">

  <input type="date" id="date">

  <select id="time">
    <option value="">Pilih Masa</option>
    <option>10:00 AM</option>
    <option>12:00 PM</option>
    <option>2:00 PM</option>
    <option>4:00 PM</option>
  </select>

  <button onclick="bookNow()">Book & Pay</button>
</div>

<script>
function bookNow() {
  let name = document.getElementById("name").value;
  let date = document.getElementById("date").value;
  let time = document.getElementById("time").value;

  if (!name || !date || !time) {
    alert("Sila lengkapkan semua maklumat!");
    return;
  }

  // Simpan sementara (localStorage)
  localStorage.setItem("booking",
    JSON.stringify({name, date, time})
  );

  // Redirect ke payment (REPLACE LINK NI)
  window.location.href = "https://toyyibpay.com/Engkuprod";
}
</script>

</body>
</html>
